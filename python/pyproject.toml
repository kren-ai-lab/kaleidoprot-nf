[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "kpnf"
version = "0.1.0.dev0"
description = "Glue operations for the kaleidoprot-nf pipeline: feature selection, block concatenation, scaling, plots and reports."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "polars>=2.0",
    "pyarrow>=17",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
kpnf = "kpnf.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kpnf"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py315"
