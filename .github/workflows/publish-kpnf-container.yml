name: publish-kpnf-container

# Builds ghcr.io/kren-ai-lab/kpnf from python/ on a pipeline release tag (v*), tagged <version> and latest,
# so each pipeline release pins the kpnf image it was released with.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/kren-ai-lab/kpnf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: python
          tags: kpnf:test
          labels: org.opencontainers.image.version=${{ env.VERSION }}
          load: true

      # kpnf's version must match the tag: bump python/pyproject.toml with the pipeline release.
      - name: Smoke test
        run: |
          docker run --rm kpnf:test kpnf --version | grep -Fx "kpnf $VERSION"
          docker run --rm kpnf:test pip check

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: python
          tags: ${{ env.IMAGE }}:${{ env.VERSION }},${{ env.IMAGE }}:latest
          labels: org.opencontainers.image.version=${{ env.VERSION }}
          push: true
