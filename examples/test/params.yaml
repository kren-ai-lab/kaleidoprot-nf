# Run from the repository root:
#   nextflow run . -profile local,test -params-file examples/test/params.yaml
#
# representations: one entry per generated representation (fan-out).
#   tool: sylphy-encode | sylphy-embed | roxy | eris
#   config: the tool's options inline (what its --config file would hold), or the path to that file;
#           checked with `<tool> validate-config` before anything runs
#   features_source (eris only): graph_attr | pooled_attr | global_embedding | auto
representations:
  - name: esm2_t6
    tool: sylphy-embed
    # ESM2 8M, mean pooling per sequence. Use device: cuda and a larger model on a GPU host.
    config:
      model: facebook/esm2_t6_8M_UR50D
      pool: mean
      layers: last
      device: cpu
      batch_size: 8
  - name: aa_frequency
    tool: sylphy-encode
    config:
      method: frequency # amino acid frequencies (20 columns)
  - name: roxy_composition
    tool: roxy
    config:
      families: [composition] # every descriptor of the composition family (~1,700 columns)
  - name: eris_contact
    tool: eris
    # residue contact graph; structure-level features come from `eris features`
    config:
      representation: residue_contact_graph
    features_source: graph_attr

# Pairwise comparison of representation spaces with `ruddy analyze representation`.
# Unset compares every pair; otherwise list them, e.g. [[esm2_t6, roxy_composition]], or [] for none.

# One-level compositions. Each block is raw, reduced (reduce: N PCA components with Ruddy) or
# selected (select: true, unsupervised filter from the block's Ruddy EDA). scaling: none | standard | block
compositions:
  - name: esm_roxy
    blocks:
      - representation: esm2_t6
        reduce: 6
      - representation: roxy_composition
        select: true
    scaling: block
  - name: sequence_structure
    blocks:
      - representation: esm2_t6
        reduce: 3
      - representation: aa_frequency
      - representation: eris_contact
        select: true
    scaling: block
